<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的第一个网页</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(120deg, #74ebd5, #9face6);
      }

      .card {
        width: min(90vw, 640px);
        padding: 2rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      h1 {
        margin-top: 0;
        color: #1f2937;
      }

      p {
        line-height: 1.8;
        color: #374151;
      }

      .btn {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 10px;
        text-decoration: none;
        color: #fff;
        background: #2563eb;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>你好，欢迎来到你的新网页 👋</h1>
      <p>
        这个页面使用纯 HTML + CSS 创建，包含标题、说明文字和一个按钮。
        你可以继续添加图片、导航栏、表单，或者接入 JavaScript 让它变得更有交互性。
      </p>
      <a class="btn" href="https://developer.mozilla.org/zh-CN/" target="_blank" rel="noreferrer">
        学习更多前端知识
      </a>
    </main>
  </body>
</html>
